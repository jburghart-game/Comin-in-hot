<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Comin' in Hot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
/* One-screen arcade cabinet: black CRT field, glowing vector strokes, HUD in the corners */
:root{
  color-scheme:dark;
  --bg:#000;
  --grid:#8a7cff;
  --road:#3ff0ff;
  --hud:#7dff6a;
  --alert:#ff3b3b;
  --car:#ff2a3c;
  --mono:"Share Tech Mono",ui-monospace,"Consolas",monospace;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#help{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font:13px var(--mono);color:var(--grid);opacity:.75;letter-spacing:.08em;pointer-events:none;padding-inline:16px}
</style>
<div id="wrap"><canvas id="c" aria-label="Comin' in Hot racing game"></canvas></div>
<div id="help">← → STEER · D JUMP · F SPIN ATTACK · SHIFT DRIFT · P PAUSE · O NEXT SONG · G LOW GLOW · M MUSIC · TOUCH: TAP MIDDLE TO JUMP, AGAIN TO SPIN</div>
<script>
(()=>{
const C={grid:'#8a7cff',road:'#3ff0ff',hud:'#7dff6a',alert:'#ff3b3b',car:'#39ff7a',mtn:'#7dff6a',yel:'#ffe14a',traffic:'#3ff0ff'};
const FONT='"Share Tech Mono",ui-monospace,Consolas,monospace';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const sc=document.createElement('canvas');let s=sc.getContext('2d');
let W=0,H=0,DPR=1;
// fixed internal resolution: the backing canvases never exceed ~1280x720 worth of pixels (about 0.92 MP),
// however big or high-DPI the window is; the browser scales the result up to fill the screen
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(window.devicePixelRatio||1,1.5,Math.sqrt(1280*720/Math.max(1,W*H)));
  for(const k of [cv,sc,ph,ov,lc]){k.width=W*DPR;k.height=H*DPR}
  // glow is blurred on small copies (quarter / half size) and stretched back up: far cheaper than full-size blurs
  for(const [k,d] of [[g4,4],[g4b,4],[g2,2],[g2b,2]]){k.width=Math.max(1,Math.round(W*DPR/d));k.height=Math.max(1,Math.round(H*DPR/d))}
  s.setTransform(DPR,0,0,DPR,0,0);makeOverlay();}
// ph = phosphor persistence buffer; ov = scratched plastic screen overlay
const ph=document.createElement('canvas'),pc=ph.getContext('2d');
const ov=document.createElement('canvas'),oc=ov.getContext('2d');
const lc=document.createElement('canvas'),lx2=lc.getContext('2d');
const g4=document.createElement('canvas'),g4b=document.createElement('canvas'),g2=document.createElement('canvas'),g2b=document.createElement('canvas');
// blurSmall: copy src into a downscaled canvas through a blur filter (radius in full-size pixels)
function blurSmall(dst,src,r){const c=dst.getContext('2d'),sc2=dst.width/src.width;c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='copy';c.filter=`blur(${Math.max(.5,r*sc2)}px)`;c.drawImage(src,0,0,dst.width,dst.height);c.filter='none';c.globalCompositeOperation='source-over';return dst} // late layer: enemies, bolts, avatar
function makeOverlay(){
  const w=ov.width,h=ov.height,R=Math.random;oc.clearRect(0,0,w,h);
  // faint blue tint and vignette like the glass over the tube
  let g=oc.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');oc.fillStyle=g;oc.fillRect(0,0,w,h);
  oc.fillStyle='rgba(40,90,160,.05)';oc.fillRect(0,0,w,h);
  // reflection glare
  g=oc.createRadialGradient(w*.62,h*.18,0,w*.62,h*.18,Math.min(w,h)*.22);
  g.addColorStop(0,'rgba(190,220,255,.10)');g.addColorStop(1,'rgba(190,220,255,0)');oc.fillStyle=g;oc.fillRect(0,0,w,h);
  g=oc.createLinearGradient(0,0,w,h);g.addColorStop(.3,'rgba(255,255,255,0)');g.addColorStop(.42,'rgba(255,255,255,.035)');g.addColorStop(.5,'rgba(255,255,255,0)');oc.fillStyle=g;oc.fillRect(0,0,w,h);
  // smudges
  for(let i=0;i<7;i++){const x=R()*w,y=R()*h,r=(40+R()*160)*DPR;g=oc.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(200,220,255,.035)');g.addColorStop(1,'rgba(200,220,255,0)');oc.fillStyle=g;oc.fillRect(x-r,y-r,r*2,r*2)}
  // scratches: fine arcs and hairlines in the plastic
  for(let i=0;i<260;i++){const x=R()*w,y=R()*h,len=(10+R()*(R()<.15?400:90))*DPR,a=R()*Math.PI*2,bend=(R()-.5)*.6;
    oc.strokeStyle=`rgba(220,235,255,${.03+R()*.09})`;oc.lineWidth=(R()<.85?.6:1.2)*DPR;oc.beginPath();oc.moveTo(x,y);
    oc.quadraticCurveTo(x+Math.cos(a+bend)*len/2,y+Math.sin(a+bend)*len/2,x+Math.cos(a)*len,y+Math.sin(a)*len);oc.stroke()}
  // swirl marks from cleaning
  for(let i=0;i<5;i++){const x=R()*w,y=R()*h,r=(60+R()*200)*DPR;for(let j=0;j<14;j++){oc.strokeStyle=`rgba(220,235,255,${.015+R()*.03})`;oc.lineWidth=.6*DPR;
    oc.beginPath();const st0=R()*6.28;oc.arc(x,y,r+j*3*DPR,st0,st0+.4+R()*1.2);oc.stroke()}}
}
addEventListener('resize',resize);resize();

// ---- track ----
const SEG=200,ROADW=2000,LANES=3,DRAW=600,CAMH=540,CAMD=1/Math.tan(62*Math.PI/180);
const segs=[];
const ease=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+.5);
function lastY(){return segs.length?segs[segs.length-1].y2:0}
function add(enter,hold,leave,curve,hill){
  const y0=lastY(),y1=y0+hill*SEG,n=enter+hold+leave;
  for(let i=0;i<n;i++){
    const c=i<enter?ease(0,curve,i/enter):i<enter+hold?curve:ease(curve,0,(i-enter-hold)/leave);
    const y=ease(y0,y1,(i+1)/n), yp=segs.length?segs[segs.length-1].y2:0;
    segs.push({i:segs.length,curve:c,y1:yp,y2:y});
  }
}
// Each level gets its own course: the same layout of stretches (so the track length and the tunnel, mall and canyon
// spots never move), but its own seeded mix of bends and rolling hills.
function build(seed=0){
  segs.length=0;let r=seed*7919+1234;const R=()=>(r=(r*16807)%2147483647)/2147483647;
  add(100,300,100,0,0);
  const base=[5,-3,-4,6,-2,-5,4,3,-6,2,-4,4],bb=[.6,0,-.7,.5,0,-.5,.8,0,-.6,.4,-.4,0];
  for(let i=0;i<base.length;i++){const hill=base[i]*(.9+R()*.9)+(R()-.5)*5,bend=(bb[i]||(R()-.5)*.8)*(.8+R()*.6)+(R()-.5)*.35;
    add(120,80,120,bend,hill);add(30,60,30,(R()-.5)*.3,(R()-.5)*3)}
  add(100,300,100,0,0);
  // close the loop: ease the last stretch back to the starting height
  const yEnd=segs[segs.length-1].y2,n=120;for(let i=0;i<n;i++){const sg=segs[segs.length-n+i];const f0=i/n,f1=(i+1)/n;
    sg.y1-=yEnd*ease(0,1,f0);sg.y2-=yEnd*ease(0,1,f1)}
}
build(0);
const TRACK=segs.length*SEG;
// road height at any world z (wraps with the track)
function groundY(z){z=((z%TRACK)+TRACK)%TRACK;const sg=segs[Math.floor(z/SEG)],f=(z%SEG)/SEG;return sg.y1+(sg.y2-sg.y1)*f}

// ---- state ----
const MAXS=SEG*240,ACC=MAXS/3,DEC=-MAXS/3,OFFDEC=-MAXS*1.2,OFFMAX=MAXS/3;
let st,sq=null,sqg=null;
const sparks=[];
// sparks in screen pixels, thrown from a rear wheel's contact point
function spark(x,y,dir,water){if(sparks.length>360)return; // particle cap
  for(let i=0;i<3;i++)sparks.push({x:x+(Math.random()-.5)*10,y,vx:dir*(250+Math.random()*700)+(Math.random()-.5)*250,vy:-(150+Math.random()*450),life:.25+Math.random()*.35,col:water?(Math.random()<.5?'#9fdcff':'#ffffff'):(Math.random()<.5?'#ffe14a':'#ffffff')})
}

  st={pos:0,speed:0,x:0,time:60,score:0,lap:1,mode:'title',msg:'',msgT:0,skyX:0,steer:0,shake:0,
      drift:false,yaw:0,yv:0,deer:[],fx:[],nextDeer:2.5,jy:0,jv:0,landed:0,lift:0,peak:0,comboT:0,complete:false,pull:0,impact:0,impactFx:0,orbDone:new Set(),noteStreak:0,notesGot:0,bestNotes:0,orbPop:0,inv:0,hurt:0,bestCombo:0,fw:[],fwp:[],lights:0,camT:0,ramps:[],rampT:7,dolT:3,swim:[],charging:false,chargeT:0,combo:0,spinT:0,wave:0,waveT:1.5,hits:0,bullets:[],dead:0,sq:0,sqv:0,best:+(load()||0)};
  sparks.length=0;
}

// run-end high score table: top 5 runs kept in this browser (score, song, wave, date)

  scoreTable.push(e);scoreTable.sort((a,b)=>b.s-a.s);scoreTable=scoreTable.slice(0,5);st.recId=scoreTable.some(x=>x.id===e.id)?e.id:null;

  if(e.code==='KeyD'&&!e.repeat&&!paused&&st.mode==='race'){jump(false);st.charging=true;st.chargeT=0}
  // F always (re)starts the spin, so a press mid-spin isn't swallowed
  if(e.code==='KeyF'&&!e.repeat&&!paused&&st.mode==='race'){st.spinT=SPIN;sfxSpin()}
  if(e.code==='KeyG'&&!e.repeat){lowGlow=!lowGlow;try{localStorage.setItem('ns_lowglow',lowGlow?'1':'0')}catch(err){}flash(lowGlow?'LOW GLOW ON':'LOW GLOW OFF',1.2)}

window.vrStep=(n=1,dt=1/60)=>{for(let i=0;i<n;i++){update(dt);pumpMusic()}render();composite()};
const CHARGE=1.05; // seconds of holding for a super jump
function jump(sup){if(st.grind){st.grind=0;st.jy=RAILY+.01;st.jv=0;sup=true} /* leaping off a rail always goes 3x high */if(st.canFly)return;if(st.mode==='race'&&(st.jy===0||st.jy===RAILY+.01)&&st.jv===0){st.jv=sup?JUMPV*Math.sqrt(3):JUMPV; // sqrt(3) x speed = 3x height
  sfxVroom();if(sup){flash('SUPER JUMP!',1);beep(330,.1);setTimeout(()=>beep(660,.1),60);setTimeout(()=>beep(990,.15),120);talk(pick(['To the moon!','Sky high!','Liftoff!']))}else beep(520,.12)}}

  else for(const t of e.changedTouches)if(t.clientX>=W*.4&&t.clientX<=W*.6){if(st.jy>0&&st.spinT<=0){st.spinT=SPIN}else{jump(false);st.charging=true;st.chargeT=0}}},{passive:false});
